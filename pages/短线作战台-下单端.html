<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短线作战台</title>
<style>
  :root{
    color-scheme: light;
    --c-line:#d5dae3; --c-text:#11151b; --c-text2:#333c48; --c-text3:#59636f;
    --c-card:#ffffff; --c-bg:#eceff4; --c-fill:#ffffff; --c-soft:#f4f6f9; --c-hover:#e8ecf2;
    --c-up:#c92d2a; --c-down:#0d8149; --c-flat:#59636f; --c-accent:#1b58c4;
    --c-tip-bg:rgba(18,22,29,.95); --c-tip-text:#fff;
    --gap:10px; --pad:12px; --r-s:4px; --r-m:8px;
  }
  @media (prefers-color-scheme: dark){ :root{
    color-scheme: dark;
    --c-line:#333c48; --c-text:#eef2f7; --c-text2:#c6cfda; --c-text3:#94a0ae;
    --c-card:#1a212a; --c-bg:#0e1319; --c-fill:#232b35; --c-soft:#212932; --c-hover:#2b3540;
    --c-up:#ff6a5e; --c-down:#35d493; --c-flat:#94a0ae; --c-accent:#71a8ff;
    --c-tip-bg:rgba(238,242,247,.96); --c-tip-text:#11151b;
  }}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:13px;}
  .app{display:flex;flex-direction:column;min-height:100vh;background:var(--c-bg);color:var(--c-text);}
  .bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:7px var(--pad);background:var(--c-card);border-bottom:1px solid var(--c-line);}
  .bar-t{font-weight:700;font-size:15px;color:var(--c-text);}
  .pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;
    font-size:11px;font-weight:700;color:#fff;background:var(--c-flat);}
  .bar-item{color:var(--c-text2);font-size:12px;}
  .bar-item b{color:var(--c-text);font-weight:600;}
  .disc{color:var(--c-text2);font-size:12px;background:var(--c-soft);border:1px dashed var(--c-line);
    border-radius:var(--r-s);padding:3px 8px;max-width:460px;}
  .bar-r{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .tabs{display:flex;gap:4px;padding:6px var(--pad) 0;background:var(--c-card);border-bottom:1px solid var(--c-line);}
  .tab{height:28px;padding:0 14px;border:1px solid transparent;border-bottom:none;background:transparent;
    color:var(--c-text2);cursor:pointer;font-size:12px;border-radius:var(--r-s) var(--r-s) 0 0;}
  .tab:hover{color:var(--c-text);background:var(--c-hover);}
  .tab.on{color:var(--c-accent);background:var(--c-bg);border-color:var(--c-line);font-weight:700;}
  .panes{flex:1;padding:var(--gap);}
  .pane{display:none;}.pane.on{display:block;}
  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);}
  .card{background:var(--c-card);border:1px solid var(--c-line);border-radius:var(--r-m);min-width:0;overflow:hidden;}
  .card-h{display:flex;align-items:center;gap:8px;padding:6px var(--pad);border-bottom:1px solid var(--c-line);}
  .card-t{font-size:12px;font-weight:700;color:var(--c-text2);letter-spacing:.4px;}
  .card-s{margin-left:auto;font-size:11px;color:var(--c-text3);}
  .card-b{padding:9px var(--pad);}
  .span12{grid-column:span 12;}.span8{grid-column:span 8;}.span6{grid-column:span 6;}.span4{grid-column:span 4;}
  .verdict{font-size:13px;font-weight:600;color:var(--c-text);background:var(--c-soft);
    border-left:3px solid var(--c-accent);border-radius:0 var(--r-s) var(--r-s) 0;padding:6px 10px;margin-bottom:8px;}
  .verdict .sub{display:block;margin-top:3px;font-weight:400;color:var(--c-text2);font-size:12px;}
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--c-line);}
  .kv{background:var(--c-card);padding:5px 8px;}
  .kv-k{display:block;color:var(--c-text3);font-size:11px;}
  .kv-v{font-size:13px;font-weight:600;color:var(--c-text);}
  .btn{height:26px;padding:0 10px;border-radius:var(--r-s);border:1px solid var(--c-line);
    background:var(--c-fill);color:var(--c-text2);cursor:pointer;font-size:12px;}
  .btn:hover{background:var(--c-hover);color:var(--c-text);}
  .sel,.inp{height:26px;border-radius:var(--r-s);border:1px solid var(--c-line);background:var(--c-fill);
    color:var(--c-text);padding:0 6px;font-size:12px;min-width:0;}
  .inp::placeholder{color:var(--c-text3);opacity:1;}
  .up{color:var(--c-up);}.down{color:var(--c-down);}.flat{color:var(--c-flat);}
  .muted{color:var(--c-text3);}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;color:var(--c-text);}
  .tbl th{text-align:left;color:var(--c-text3);font-weight:600;font-size:11px;padding:4px 6px;
    border-bottom:1px solid var(--c-line);white-space:nowrap;}
  .tbl td{padding:4px 6px;border-bottom:1px solid var(--c-line);white-space:nowrap;}
  .tbl tbody tr:hover{background:var(--c-hover);}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums;}
  .scroll-y{max-height:300px;overflow:auto;}
  .scroll-x{overflow-x:auto;}
  .tagx{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11px;
    border:1px solid var(--c-line);color:var(--c-text2);background:var(--c-soft);}
  .tagx.on{border-color:var(--c-accent);color:var(--c-accent);}
  .hbar{display:grid;grid-template-columns:92px 1fr 62px;align-items:center;gap:6px;padding:2px 0;cursor:pointer;}
  .hbar:hover{background:var(--c-hover);}
  .hbar-name{color:var(--c-text2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{height:9px;background:var(--c-soft);border-radius:5px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:5px;}
  .hbar-val{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;}
  .ano-list{display:flex;flex-direction:column;gap:6px;}
  .ano-card{border:1px solid var(--c-line);border-radius:var(--r-s);padding:7px 9px;background:var(--c-soft);cursor:pointer;}
  .ano-card:hover{background:var(--c-hover);}
  .ano-card.is-new{border-color:var(--c-accent);box-shadow:inset 3px 0 0 var(--c-accent);}
  .ano-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ano-name{font-weight:700;color:var(--c-text);}
  .ano-b{margin-top:4px;color:var(--c-text2);font-size:12px;}
  .sig{padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;border:1px solid;background:var(--c-soft);}
  .sig-follow{color:var(--c-up);border-color:var(--c-up);}
  .sig-wait{color:var(--c-text2);border-color:var(--c-line);}
  .sig-avoid{color:var(--c-down);border-color:var(--c-down);}
  .details{border:1px solid var(--c-line);border-radius:var(--r-s);margin-top:6px;padding:6px 9px;background:var(--c-card);color:var(--c-text);}
  .thr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 10px;}
  .thr label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c-text2);}
  .thr input{width:64px;}
  .gauge{width:150px;height:88px;}
  .gauge-num{font-size:22px;font-weight:700;fill:var(--c-text);}
  .gauge-cap{font-size:10px;fill:var(--c-text3);}
  .basis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:3px 12px;margin-top:8px;}
  .basis div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--c-line);
    padding:3px 0;font-size:11px;color:var(--c-text2);}
  #tip{position:fixed;z-index:60;pointer-events:none;padding:5px 8px;border-radius:var(--r-s);
    background:var(--c-tip-bg);color:var(--c-tip-text);font-size:11px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:pre-line;}
  [hidden]{display:none !important;}
  @media (max-width:900px){
    .span8,.span6,.span4{grid-column:span 12;}
    .bar{position:static;}.disc{max-width:100%;}.scroll-y{max-height:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span class="bar-t">短线作战台</span>
    <span class="pill" id="bar-stage">情绪待判定</span>
    <span class="bar-item">建议仓位 <b id="bar-position">--</b></span>
    <span class="bar-item">账户 <b id="bar-account">--</b></span>
    <span class="disc" id="bar-discipline">--</span>
    <div class="bar-r">
      <span class="muted" id="load-state"></span>
      <button class="btn" id="reload" type="button">刷新</button>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab on" type="button" data-pane="emotion">情绪全景</button>
    <button class="tab" type="button" data-pane="intraday">盘中异动</button>
    <button class="tab" type="button" data-pane="review">盘后复盘</button>
  </nav>

  <main class="panes">
    <section class="pane on" id="pane-emotion">
      <div class="grid">
        <section class="card span8">
          <div class="card-h"><span class="card-t">短线情绪温度计</span><span class="card-s" id="emo-scope"></span></div>
          <div class="card-b">
            <div class="verdict" id="emo-verdict">正在计算当日情绪…</div>
            <div class="row" style="align-items:center;gap:16px">
              <div id="emo-gauge"></div>
              <div style="flex:1;min-width:220px">
                <div class="row"><span class="kv-k">当前阶段</span><b id="emo-stage" style="font-size:15px">--</b>
                  <span class="kv-k">综合情绪分</span><b id="emo-score">--</b></div>
                <div class="basis" id="emo-basis"></div>
              </div>
            </div>
          </div>
        </section>
        <section class="card span4">
          <div class="card-h"><span class="card-t">情绪核心指标</span></div>
          <div class="card-b"><div class="kv-grid" id="emo-core"></div></div>
        </section>
        <section class="card span6">
          <div class="card-h"><span class="card-t">主要指数</span></div>
          <div class="card-b"><table class="tbl"><thead><tr><th>指数</th><th class="num">收盘</th><th class="num">涨跌幅</th></tr></thead><tbody id="index-body"></tbody></table></div>
        </section>
        <section class="card span6">
          <div class="card-h"><span class="card-t">板块强弱</span><span class="card-s">点击板块可查看成分股</span></div>
          <div class="card-b">
            <div class="row" style="margin-bottom:4px">
              <button class="tab on" type="button" data-board="industry" style="height:22px;font-size:11px">行业</button>
              <button class="tab" type="button" data-board="concept" style="height:22px;font-size:11px">概念</button>
            </div>
            <div id="sector-body"></div>
            <div id="sector-drill"></div>
          </div>
        </section>
        <section class="card span12">
          <div class="card-h"><span class="card-t">连板梯队</span><span class="card-s" id="ladder-scope"></span></div>
          <div class="card-b">
            <div class="basis" id="ladder-caps"></div>
            <div class="scroll-y" style="margin-top:6px">
              <table class="tbl"><thead><tr><th>层级</th><th>个股</th><th>所属题材</th><th>今日状态</th></tr></thead><tbody id="ladder-body"></tbody></table>
            </div>
          </div>
        </section>
        <section class="card span12">
          <div class="card-h"><span class="card-t">涨停明细</span><span class="card-s" id="limitup-scope"></span></div>
          <div class="card-b"><div class="scroll-y">
            <table class="tbl"><thead><tr><th>名称</th><th>代码</th><th class="num">最新价</th><th class="num">涨跌幅</th><th>涨停原因</th></tr></thead><tbody id="limitup-body"></tbody></table>
          </div></div>
        </section>
      </div>
    </section>

    <section class="pane" id="pane-intraday">
      <div class="grid">
        <section class="card span12">
          <div class="card-h"><span class="card-t">异动归因解释器</span><span class="card-s" id="ano-scope"></span></div>
          <div class="card-b">
            <div class="verdict" id="ano-verdict">正在读取持仓与自选…</div>
            <div class="card" style="margin-bottom:8px">
              <div class="card-h"><span class="card-t">监控范围</span><span class="card-s">来源为下单客户端持仓与自选股</span></div>
              <div class="card-b">
                <div class="row" id="watch-groups"></div>
                <div class="row" style="margin-top:8px">
                  <input class="inp" id="search-kw" placeholder="搜索证券代码或名称">
                  <button class="btn" id="search-go" type="button">搜索</button>
                  <button class="btn" id="watch-add" type="button">加入自选</button>
                  <button class="btn" id="open-stock" type="button">打开个股</button>
                </div>
                <div class="row muted" id="search-result" style="margin-top:6px"></div>
              </div>
            </div>
            <div class="card" style="margin-bottom:8px">
              <div class="card-h"><span class="card-t">异动触发阈值</span><span class="card-s">调整后按新阈值重算</span></div>
              <div class="card-b"><div class="thr">
                <label>拉升幅度(％) <input class="inp" id="thr-rise" type="number" step="0.5" min="0"></label>
                <label>下跌幅度(％) <input class="inp" id="thr-fall" type="number" step="0.5" min="0"></label>
                <label>放量量比 <input class="inp" id="thr-vol" type="number" step="0.1" min="0"></label>
                <button class="btn" id="thr-save" type="button">保存阈值</button>
              </div></div>
            </div>
            <div class="ano-list" id="ano-list"></div>
            <div id="ano-detail"></div>
          </div>
        </section>
      </div>
    </section>

    <section class="pane" id="pane-review">
      <div class="grid">
        <section class="card span12">
          <div class="card-h"><span class="card-t">持仓复盘</span><span class="card-s" id="pos-scope"></span></div>
          <div class="card-b">
            <div class="verdict" id="pos-verdict">正在读取账户与持仓…</div>
            <div class="kv-grid" id="pos-summary"></div>
            <div class="scroll-y" style="margin-top:8px">
              <table class="tbl"><thead><tr><th>名称</th><th>代码</th><th class="num">持仓</th><th class="num">可用</th><th class="num">成本价</th><th class="num">市价</th><th class="num">市值</th><th class="num">浮动盈亏</th><th class="num">盈亏率</th></tr></thead><tbody id="pos-body"></tbody></table>
            </div>
          </div>
        </section>
        <section class="card span12" id="m-blotter" hidden>
          <div class="card-h"><span class="card-t">交割单复盘</span><span class="card-s" id="blotter-scope"></span></div>
          <div class="card-b">
            <div class="verdict" id="rev-verdict">正在读取历史成交…</div>
            <div class="row">
              <label class="muted">起始 <input class="inp" id="blotter-start" type="date"></label>
              <label class="muted">结束 <input class="inp" id="blotter-end" type="date"></label>
              <button class="btn" id="blotter-load" type="button">读取交割单</button>
              <span class="muted" id="blotter-count"></span>
            </div>
            <div class="scroll-y" style="margin-top:8px;max-height:220px" id="blotter-wrap">
              <table class="tbl" id="blotter-table"><thead id="blotter-head"></thead><tbody id="blotter-body"></tbody></table>
            </div>
          </div>
        </section>
        <section class="card span6" id="m-attrib" hidden>
          <div class="card-h"><span class="card-t">盈亏归因</span></div>
          <div class="card-b"><div id="pnl-attrib"></div></div>
        </section>
        <section class="card span6" id="m-bias" hidden>
          <div class="card-h"><span class="card-t">行为偏差识别</span><span class="card-s">点击查看对应交易</span></div>
          <div class="card-b"><div id="bias-list"></div><div id="bias-detail"></div></div>
        </section>
        <section class="card span12" id="m-advice" hidden>
          <div class="card-h"><span class="card-t">改进建议</span></div>
          <div class="card-b"><div id="advice-list"></div></div>
        </section>
      </div>
    </section>
  </main>
</div>
<div id="tip" hidden></div>

<script>
(function () {
  'use strict';

  var HOST_CALL = 'ai_selector.invokeSkillCommand';
  var STAGES = ['冰点', '修复', '发酵', '高潮', '分歧', '退潮'];
  var STAGE_COLOR = { '冰点': '#2f6fd0', '修复': '#1b58c4', '发酵': '#b3730a', '高潮': '#c92d2a', '分歧': '#7a4fd0', '退潮': '#0d8149' };
  var STAGE_POSITION = { '冰点': '0-2成', '修复': '2-4成', '发酵': '4-6成', '高潮': '5-7成（不追高）', '分歧': '2-4成', '退潮': '0-2成' };
  var QUOTE_FIELDS = ['StockName', 'pre_close', 'open', 'high', 'low', 'price', 'volume', 'amount', 'hs', 'lb', 'zf', 'zt_p', 'dt_p', 'DDE', 'np', 'wpcjl'];
  var INDEX_TARGETS = ['上证指数', '深证成指', '创业板指'];
  var state = {
    quotes: {}, watch: { hold: [], list: [] }, anomalies: [], seen: {}, stage: null, score: null,
    emotion: null, sectors: { industry: [], concept: [] }, boardKind: 'industry', ladder: null, limitUpRows: [], pairs: [], biases: []
  };
  var el = function (id) { return document.getElementById(id); };
  var clamp = function (v) { return v <= 0 ? 0 : v >= 1 ? 1 : v; };
  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fix(v) { if (v == null) return '--'; var n = Math.abs(v); return n >= 1000 ? v.toFixed(0) : n >= 100 ? v.toFixed(1) : v.toFixed(2); }
  function pct(v, d) { return v == null ? '--' : (v > 0 ? '+' : '') + v.toFixed(d == null ? 2 : d) + '%'; }
  function cls(v) { return v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
  function yi(v) {
    if (v == null) return '--';
    var a = Math.abs(v);
    if (a >= 1e12) return (v / 1e12).toFixed(2) + '万亿';
    if (a >= 1e8) return (v / 1e8).toFixed(0) + '亿';
    if (a >= 1e4) return (v / 1e4).toFixed(0) + '万';
    return v.toFixed(0);
  }
  function signYi(v) { return v == null ? '--' : (v > 0 ? '+' : '') + yi(v); }
  function clock() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  function today() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function daysAgo(n) { var d = new Date(Date.now() - n * 86400000), p = function (x) { return (x < 10 ? '0' : '') + x; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function compact(date) { return String(date || '').replace(/-/g, ''); }
  function tip(t) { return ' data-tip="' + esc(t) + '"'; }
  function setState(t) { var n = el('load-state'); if (n) n.textContent = t || ''; }
  function store(key, value) {
    try {
      if (arguments.length === 1) { var raw = window.localStorage.getItem(key); return raw == null ? null : JSON.parse(raw); }
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { console.warn('[作战台] 本地设置不可用', e && e.message); }
    return null;
  }
  function field(row, pattern) {
    if (!row) return null;
    var keys = Object.keys(row);
    for (var i = 0; i < keys.length; i++) if (pattern.test(keys[i])) return row[keys[i]];
    return null;
  }

  /* ---------- 下单客户端桥 ---------- */
  var chain = Promise.resolve();
  function queued(job) {
    var next = chain.then(job, job);
    chain = next.then(function () {}, function () {});
    return next;
  }
  function invoke(command, input, timeoutMs) {
    return new Promise(function (resolve, reject) {
      if (!window.cefQuery) { reject(new Error('下单客户端未就绪')); return; }
      window.cefQuery({
        request: JSON.stringify({
          method: 'external.CB_Function',
          params: { operate: HOST_CALL, opParam: JSON.stringify({ command: command, input: input || {} }) }
        }),
        onSuccess: function (response) { resolve(typeof response === 'string' ? response : JSON.stringify(response)); },
        onFailure: function (code, message) { reject(new Error(message || ('客户端回包失败 ' + code))); }
      });
    });
  }
  function parseDoc(text) {
    var s = String(text == null ? '' : text).replace(/^\uFEFF/, '');

      rows.push({

    if (!box) return;
    var item = (state.biases || []).filter(function (x) { return x.id === id; })[0];
    if (!item || !item.hits.length) { box.innerHTML = ''; return; }
    if (box.dataset.id === id) { box.innerHTML = ''; box.dataset.id = ''; return; }
    box.dataset.id = id;
    box.innerHTML = '<div class="details"><div><b>' + esc(item.name) + '</b><span class="muted" style="margin-left:8px">' + esc(item.desc) + '</span></div>'
      + '<div class="scroll-y"><table class="tbl"><thead><tr><th>买入日</th><th>卖出日</th><th>代码</th><th>名称</th><th class="num">买入价</th><th class="num">卖出价</th><th class="num">数量</th><th class="num">盈亏</th></tr></thead><tbody>'
      + item.hits.map(function (h) {
        return '<tr><td>' + esc(h.buyDate) + '</td><td>' + esc(h.sellDate) + '</td><td class="muted">' + esc(h.code) + '</td><td>' + esc(h.name) + '</td>'
          + '<td class="num">' + fix(h.buyPrice) + '</td><td class="num">' + fix(h.sellPrice) + '</td><td class="num">' + h.qty + '</td>'
          + '<td class="num ' + cls(h.profit) + '">' + signYi(h.profit) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  function renderAdvice(pairs) {
    var advice = [];
    var worst = state.worstBias;
    if (worst) advice.push('优先修正「' + worst.name + '」：样本中出现 ' + worst.count + ' 次，累计影响 ' + signYi(worst.loss) + '。');
    var avg = pairs.reduce(function (a, p) { return a + p.amount; }, 0) / pairs.length;
    var big = pairs.filter(function (p) { return p.amount > avg * 1.5 && p.profit < 0; });
    if (big.length) advice.push('控制单笔仓位上限：' + big.length + ' 笔超过平均成交金额 1.5 倍的重仓交易出现亏损。');
    var losses = pairs.filter(function (p) { return p.profit < 0; });
    if (losses.length) advice.push('复盘 ' + losses.length + ' 笔亏损交易的买点：其中 ' + losses.filter(function (p) { return p.buyClose && p.buyPrice > p.buyClose.close; }).length + ' 笔买在当日收盘价之上。');
    while (advice.length < 3) advice.push('继续导入更长区间的交割单，行为诊断结论会更稳定。');
    el('advice-list').innerHTML = advice.slice(0, 3).map(function (t, i) {
      return '<div class="ano-card"><div class="ano-h"><b>建议 ' + (i + 1) + '</b><span>' + esc(t) + '</span></div></div>';
    }).join('');
    el('m-advice').hidden = false;
    var summary = { updatedAt: new Date().toISOString(), pairCount: pairs.length, worstBias: worst ? { name: worst.name, count: worst.count, loss: worst.loss } : null, advice: advice.slice(0, 3) };
    store('scs.xiadan.review', summary);
    state.reviewSummary = summary;
    syncDiscipline();
  }

  /* ---------- 顶栏与编排 ---------- */
  function syncDiscipline() {
    var summary = state.reviewSummary || store('scs.xiadan.review');
    var box = el('bar-discipline');
    if (!summary) { box.textContent = '纪律提醒：尚无可用的复盘诊断结果。'; return; }
    var parts = [];
    if (summary.worstBias) parts.push('最近复盘发现「' + summary.worstBias.name + '」' + summary.worstBias.count + ' 次');
    box.textContent = '纪律提醒：' + (parts.length ? parts.join('，') + '。' : '') + (summary.advice && summary.advice[0] ? summary.advice[0] : '');
  }
  function renderBar() {
    var pill = el('bar-stage');
    pill.textContent = state.stage ? (state.stage + '期') : '情绪待判定';
    pill.style.background = state.stage ? (STAGE_COLOR[state.stage] || 'var(--c-flat)') : 'var(--c-flat)';
    el('bar-position').textContent = state.stage ? (STAGE_POSITION[state.stage] || '--') : '--';
  }
  function loadAccountLabel() {
    return call('assets', {}, 30000).then(biz).then(function (data) {
      var credit = data && data.is_credit;
      el('bar-account').textContent = credit ? '信用账户' : '普通账户';
    }).catch(function () { el('bar-account').textContent = '--'; });
  }
  function loadIntraday() {
    setState('正在读取持仓、自选与行情…');
    return loadScope().then(function () {
      renderScope();
      var codes = [];
      (state.holdings || []).forEach(function (h) { if (codes.indexOf(h.code) < 0) codes.push(h.code); });
      (state.watch.list || []).forEach(function (w) { if (codes.indexOf(w.code) < 0) codes.push(w.code); });
      return quoteBlock(codes);
    }).then(function (block) {
      state.quotes = block;
      detect();
      renderAnomalies();
      if (!state.sectors.industry.length) return loadSectors();
      return null;
    }).then(function () { return attribute(); }).then(function () {
      renderAnomalies();
      setState('');
    }).catch(function (e) {
      console.warn('[作战台] 盘中异动加载失败', e && e.message);
      setState('行情数据暂不可用，请稍后刷新');
    });
  }
  function refreshAll() {
    return loadAccountLabel()
      .then(function () { return loadEmotion(); })
      .then(function () { return loadSectors(); })
      .then(function () { return loadIntraday(); })
      .then(function () { return loadReview(); })
      .then(function () { setState(''); });
  }
  function activate(name) {
    Array.prototype.forEach.call(document.querySelectorAll('.tab[data-pane]'), function (t) { t.classList.toggle('on', t.dataset.pane === name); });
    Array.prototype.forEach.call(document.querySelectorAll('.pane'), function (p) { p.classList.toggle('on', p.id === 'pane-' + name); });
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('mousemove', function (event) {
    var node = event.target && event.target.closest ? event.target.closest('[data-tip]') : null;
    var tipEl = el('tip');
    if (!node) { tipEl.hidden = true; return; }
    tipEl.textContent = node.getAttribute('data-tip');
    tipEl.hidden = false;
    tipEl.style.left = Math.min(event.clientX + 12, window.innerWidth - tipEl.offsetWidth - 8) + 'px';
    tipEl.style.top = Math.max(event.clientY - tipEl.offsetHeight - 10, 4) + 'px';
  }, { passive: true });

  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target || !target.closest) return;
    var paneTab = target.closest('.tab[data-pane]');
    if (paneTab) { activate(paneTab.dataset.pane); return; }
    var boardTab = target.closest('.tab[data-board]');
    if (boardTab) {
      state.boardKind = boardTab.dataset.board;
      Array.prototype.forEach.call(document.querySelectorAll('.tab[data-board]'), function (t) { t.classList.toggle('on', t === boardTab); });
      renderSectors();
      return;
    }
    var sector = target.closest('.hbar[data-sector]');
    if (sector) { drillSector(sector.dataset.sector); return; }
    var ano = target.closest('.ano-card[data-ano]');
    if (ano) { renderDetail(ano.dataset.ano); return; }
    var bias = target.closest('[data-bias]');
    if (bias) { renderBiasDetail(bias.dataset.bias); return; }
    var open = target.closest('[data-open]');
    if (open) {
      call('stock-open', { code: open.dataset.open }, 20000).catch(function (e) { console.warn('[作战台] 打开个股失败', e && e.message); });
      return;
    }
  });

  el('reload').addEventListener('click', function () { refreshAll().catch(function (e) { console.warn('[作战台] 刷新失败', e && e.message); }); });
  el('thr-save').addEventListener('click', function () {
    store('scs.xiadan.thresholds', { rise: Number(el('thr-rise').value) || 5, fall: Number(el('thr-fall').value) || 5, volume: Number(el('thr-vol').value) || 2 });
    detect(); renderAnomalies();
  });
  el('search-go').addEventListener('click', function () {
    var kw = el('search-kw').value.trim();
    if (!kw) return;
    call('stock-search', { keyword: kw, limit: 10 }, 20000).then(biz).then(function (data) {
      var items = (data && data.data && data.data.items) || [];
      if (!items.length) { el('search-result').textContent = ''; return; }
      el('search-result').innerHTML = items.map(function (it) {
        return '<span class="tagx" data-pick="' + esc(it.code) + '" data-name="' + esc(it.name) + '">' + esc(it.name) + ' ' + esc(it.code) + '</span>';
      }).join(' ');
    }).catch(function (e) { console.warn('[作战台] 搜索失败', e && e.message); });
  });
  document.addEventListener('click', function (event) {
    var pick = event.target && event.target.closest ? event.target.closest('[data-pick]') : null;
    if (pick) { el('search-kw').value = pick.dataset.name + ' ' + pick.dataset.pick; }
  });
  el('watch-add').addEventListener('click', function () {
    var raw = el('search-kw').value.trim();
    var match = raw.match(/(\d{5,6}|[A-Z]{2,6}\d*)\s*$/);
    var code = match ? match[1] : (raw.match(/\d{5,6}/) || [])[0];
    if (!code) { console.warn('[作战台] 未识别证券代码'); return; }
    call('watchlist-add', { code: code }, 20000).then(biz).then(function () {
      return call('watchlist-refresh', {}, 20000);
    }).then(function () { return call('watchlist', {}, 20000).then(biz); }).then(function (data) {
      var items = (data && data.data && data.data.items) || {};
      state.watch.list = Object.keys(items).map(function (k) { return { code: k, name: String(items[k]) }; });
      renderScope();
    }).catch(function (e) { console.warn('[作战台] 加入自选失败', e && e.message); });
  });
  el('open-stock').addEventListener('click', function () {
    var raw = el('search-kw').value.trim();
    var code = (raw.match(/\d{5,6}/) || [])[0];
    if (!code) return;
    call('stock-open', { code: code }, 20000).catch(function (e) { console.warn('[作战台] 打开个股失败', e && e.message); });
  });
  el('blotter-load').addEventListener('click', function () {
    var from = el('blotter-start').value || daysAgo(90);
    var to = el('blotter-end').value || today();
    loadBlotter(from, to).catch(function (e) { console.warn('[作战台] 交割单读取失败', e && e.message); });
  });

  /* ---------- 启动 ---------- */
  try {
    fillThresholds();
    syncDiscipline();
    el('blotter-start').value = daysAgo(90);
    el('blotter-end').value = today();
    if (!window.cefQuery) {
      setState('未在下单客户端内打开，数据不可用');
      el('emo-verdict').textContent = '请在客户端「AI 应用」中打开本页以读取实时数据。';
      el('ano-verdict').textContent = '';
      el('pos-verdict').textContent = '';
    } else {
      refreshAll().catch(function (e) { console.warn('[作战台] 初始化失败', e && e.message); setState('数据加载失败，请点击刷新重试'); });
    }
  } catch (error) {
    console.warn('[作战台] 初始化失败', error && error.message);
    setState('数据加载失败，请点击刷新重试');
  }
})();
</script>
</body>
</html>
